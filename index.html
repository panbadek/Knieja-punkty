<!doctype html>
<html lang="pl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>
// Stary adres (/Kniejapunkty/) w przeglądarce → nowy adres. Zainstalowane wcześniej aplikacje/skróty działają bez przekierowania.
(function () { try {
  var old = /^\/Kniejapunkty(\/|$)/.test(location.pathname);
  var app = matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  if (old && !app) location.replace("/Knieja-punkty/" + location.search + location.hash);
} catch (e) {} })();
</script>

<title>Punktacja zastępów</title>
<link rel="manifest" href="manifest.json?v=20261022-170251"><meta name="theme-color" content="#2f5d3a">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-title" content="Kniejapunkty">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2a22;--mut:#6b746d;--acc:#2f5d3a;--acc2:#e9efe8;--warn:#b5532f;--line:#ddd6c8}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e8ece6;--mut:#9aa39b;--acc:#7fbf8c;--acc2:#24302a;--warn:#e08a66;--line:#2e3731}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--acc);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
@media (prefers-color-scheme:dark){header{color:#0f1410}}
header h1{font-size:18px;margin:0}header small{opacity:.85}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px}
button{font:inherit;border:1px solid var(--line);background:var(--acc2);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}@media (prefers-color-scheme:dark){button.pri{color:#0f1410}}
button.on{outline:2px solid var(--acc)}button.del{color:var(--warn)}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
input[type=number]{width:70px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:600}td.n,th.n{text-align:right}
.scroll{overflow-x:auto}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.mut{color:var(--mut);font-size:13px}.badge{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--acc2)}
.badge.w{background:#f6e3c5;color:#7a4b10}.badge.ok{background:#d6ead9;color:#245c31}.badge.no{background:#f3d6cc;color:#8a2f17}
.rank{display:grid;gap:8px}.rank .it{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--acc2)}
.rank .pos{font-weight:700;font-size:18px;text-align:center}.rank .pts{font-weight:700;font-size:18px}
.fire{font-size:13px}.err{color:var(--warn)}
td.act{white-space:nowrap}td.act button{margin:2px 2px 2px 0}
.it2{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}.it2:last-of-type{border-bottom:0}
button.big{font-size:17px;padding:12px 16px;width:100%}
img.ph{max-width:100%;max-height:50vh;border-radius:10px;border:1px solid var(--line)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal[hidden]{display:none}#modal .box{background:var(--card);border-radius:12px;padding:12px;max-width:100%;max-height:100%;overflow:auto;display:grid;gap:10px}
#modal img{max-width:100%;max-height:75vh;border-radius:8px}
details summary{cursor:pointer;padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px}
.grid figure{margin:0;cursor:pointer;background:var(--acc2);border-radius:10px;overflow:hidden}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.grid figcaption{padding:6px 8px;font-size:12px}
a.btn{display:inline-block;text-decoration:none;font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 12px;background:var(--acc2);color:var(--ink)}
a.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#upd{background:#e9b949;color:#2b2000;padding:10px 16px;font-weight:600;cursor:pointer;text-align:center}#upd[hidden]{display:none}
footer#ver{text-align:center;padding:8px 16px 24px;font-size:12px}
.row[hidden],tr[hidden]{display:none}
.hlist{display:grid;gap:8px;margin:8px 0}
.hl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.hl.kor{background:rgba(233,185,73,.12)}
.hl-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hl-pts{font-weight:700;font-size:17px;white-space:nowrap;color:var(--acc)}.hl-pts.neg{color:var(--warn)}
.hl .row{margin:4px 0 0}
td.n{white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}.lg{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.lg i,.tip i{display:inline-block;width:14px;height:3px;border-radius:2px}.lg b{font-weight:600}
#chsvgbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.viz .gl{stroke:var(--line);stroke-width:1}.viz .g0{stroke:var(--mut)}.viz .ax{fill:var(--mut);font-size:11px}
.viz .cross{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3}.viz .dot{stroke:var(--card);stroke-width:2}
.tip{position:absolute;top:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:none;min-width:130px}
.tip div{display:flex;align-items:center;gap:6px}.tip span{margin-left:auto;font-weight:600;padding-left:10px}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.tile{background:var(--acc2);border-radius:10px;padding:10px 12px}.tile b{display:block;font-size:22px;margin:2px 0}
.fld{border-bottom:1px solid var(--line);padding:8px 0}.fld:last-child{border-bottom:0}.fv{font-size:17px;font-weight:600}
.perm{display:inline-block;font-size:12px;color:var(--mut);margin-top:2px}
label.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
label.sw input{position:absolute;opacity:0;width:0;height:0}
label.sw span{width:46px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
label.sw span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
label.sw input:checked+span{background:var(--acc)}label.sw input:checked+span::after{left:23px}
label.sw input:disabled+span{opacity:.5}
</style></head>
<body>
<div id="upd" hidden>🔄 Jest nowa wersja aplikacji — dotknij, aby odświeżyć</div>
<header><div><h1>Punktacja zastępów</h1><small id="who">niezalogowany</small></div><div id="authbox"></div></header>
<nav id="nav"></nav>
<main id="main"><div class="card">Ładowanie…</div></main>
<footer id="ver" class="mut"></footer>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="galleryInput" accept="image/*" hidden>
<div id="modal" hidden></div>
<script type="module" src="app.js?v=20261022-170251"></script>
</body></html>
